name: Customer Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type MIGRATE to confirm execution against the configured database"
        required: true
        default: ""
        type: string
      target_mode:
        description: "Prepare target before migration"
        required: true
        default: "existing"
        type: choice
        options:
          - clean
          - existing

permissions:
  contents: read

jobs:
  migrate:
    name: Run customer migration
    if: ${{ inputs.confirm == 'MIGRATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate database configuration
        shell: bash
        run: |
          test -n "$DB_URL" || { echo "DB_URL secret is not configured"; exit 1; }
          test -n "$DB_USERNAME" || { echo "DB_USERNAME secret is not configured"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "DB_PASSWORD secret is not configured"; exit 1; }
          echo "Database configuration detected. Credentials are not displayed."

      - name: Prepare target database
        if: ${{ inputs.target_mode == 'clean' }}
        shell: bash
        run: |
          DB_URL_NATIVE="${DB_URL#jdbc:}"
          export PGPASSWORD="$DB_PASSWORD"
          echo "Cleaning target migration data..."
          psql "$DB_URL_NATIVE" -U "$DB_USERNAME" \
            -c "TRUNCATE TABLE target.customers, target.migration_errors RESTART IDENTITY;"
          echo "Target migration data cleaned."

      - name: Run migration and capture results
        shell: bash
        run: |
          set +e
          mvn -B spring-boot:run "-Dspring-boot.run.arguments=--batch.migration.enabled=true" 2>&1 | tee migration.log
          migration_status=${PIPESTATUS[0]}
          set -e

          step_total=$(grep -oE 'Step total: [0-9]+ ms' migration.log | tail -1 | sed 's/.*Step total: //')
          reader_time=$(grep -oE 'Reader time: [0-9]+ ms' migration.log | tail -1 | sed 's/.*Reader time: //')
          processor_time=$(grep -oE 'Processor time: [0-9]+ ms' migration.log | tail -1 | sed 's/.*Processor time: //')
          writer_time=$(grep -oE 'Writer time: [0-9]+ ms' migration.log | tail -1 | sed 's/.*Writer time: //')
          metrics=$(grep 'Reads: ' migration.log | tail -1 | sed 's/.*Reads: //')
          job_status=$(grep -oE 'status: \[[A-Z]+\]' migration.log | tail -1 | sed 's/status: \[//;s/\]//')

          inserts=$(echo "$metrics" | grep -oE 'inserts: [0-9]+' | sed 's/inserts: //' || true)
          existing=$(echo "$metrics" | grep -oE 'existing: [0-9]+' | sed 's/existing: //' || true)
          business_updates=$(echo "$metrics" | grep -oE 'business updates: [0-9]+' | sed 's/business updates: //' || true)
          unchanged=$(echo "$metrics" | grep -oE 'unchanged: [0-9]+' | sed 's/unchanged: //' || true)

          {
            echo "## Customer Migration"
            echo
            if [ "$migration_status" -eq 0 ]; then
              echo "### Result: SUCCESS"
            else
              echo "### Result: FAILED"
            fi
            echo
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Target mode | ${{ inputs.target_mode }} |"
            echo "| Job status | ${job_status:-UNKNOWN} |"
            echo "| Step total | ${step_total:-N/A} |"
            echo "| Reader time | ${reader_time:-N/A} |"
            echo "| Processor time | ${processor_time:-N/A} |"
            echo "| Writer time | ${writer_time:-N/A} |"
            echo "| Inserts | ${inserts:-N/A} |"
            echo "| Existing | ${existing:-N/A} |"
            echo "| Business updates | ${business_updates:-N/A} |"
            echo "| Unchanged | ${unchanged:-N/A} |"
            echo "| Batch counters | ${metrics:-N/A} |"
            echo
            echo "Execution source: GitHub Actions"
            echo "Database credentials: GitHub Secrets"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$migration_status"
